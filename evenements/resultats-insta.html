<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--red:#cc0000;--bg:#080808;--fg:#f0f0f0;--muted:#8a8a8a;--card:#111;--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Barlow Condensed',system-ui,sans-serif;min-height:100vh}
header{background:#000;border-bottom:3px solid var(--red);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:'Bebas Neue';font-size:26px;letter-spacing:.08em}
header h1 span{color:var(--red)}
header a{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:24px 18px 60px}
.panel{background:var(--card);border:1px solid var(--line);padding:18px;position:relative;align-self:start}
.panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
label:first-child{margin-top:0}
select,input,textarea{width:100%;background:#050505;color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px;font-family:inherit;font-size:16px}
textarea{min-height:170px;font-size:14px;line-height:1.4}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{background:#050505;color:var(--muted);border:1px solid rgba(255,255,255,.15);padding:10px;font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.hint{font-size:13px;color:var(--muted);line-height:1.4;margin-top:6px}
.dl{margin-top:18px;width:100%;background:var(--red);color:#fff;border:0;padding:14px;font-family:inherit;font-weight:900;font-size:15px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 22px rgba(200,0,0,.5)}
.preview{display:flex;justify-content:center}
canvas{width:100%;max-width:540px;height:auto;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000}
#manualBox{display:none}
@media(max-width:860px){.layout{grid-template-columns:1fr}.preview{order:-1}}
</style>
</head>

</header>

      <option value="manual">Saisie manuelle (ex. Finale)</option>

    <div id="autoBox">
      <label>Catégorie</label>
      <select id="cat"></select>
    </div>

    <div id="manualBox">
      <label>Titre de l'image</label>
      <input id="mTitle" value="FINALE MONTREUX">
      <label>Date / lieu</label>
      <input id="mDate" value="31 octobre 2026 · Montreux">
      <label>Catégorie</label>
      <input id="mCat" value="PRO · PARK">
      <label>Résultats (1 rider par ligne)</label>
      <textarea id="mList">Nom Prénom; 82,5; Club / Sponsor
Nom Prénom; 77; Club / Sponsor
Nom Prénom; 70; Club / Sponsor</textarea>
      <div class="hint">Format : Nom ; Score ; Infos (les infos sont facultatives). Dans l'ordre du classement.</div>
    </div>

    <label>Format</label>
    <div class="seg" id="fmt">
      <button data-f="post" class="on">Post 4:5</button>
      <button data-f="story">Story 9:16</button>
    </div>

    <label>Nombre de riders affichés</label>
    <select id="top">
      <option value="3">Podium (Top 3)</option>
      <option value="5">Top 5</option>
      <option value="8" selected>Top 8</option>
      <option value="12">Top 12</option>

    <button class="dl" id="dl">⬇ Télécharger l'image</button>
    <div class="hint">L'image se télécharge en PNG, prête à poster sur Instagram.</div>

/* ===== Normalisation des données ===== */
const fmtNum=n=>n==null?null:String(n).replace('.',',');
const btOk=b=>b!=null && parseFloat(String(b).replace(',','.'))>0;
const EVENTS={
  mtx:{title:'MONTREUX',date:'30 mai 2026 · 1re manche',cats:[]},
  vidy:{title:'VIDY',date:'27 juin 2026 · 2e manche · Lausanne',cats:[]}
};
const MTX_LABEL={'street-pro':'PRO · STREET','pro-park':'PRO · PARK','amateur-street':'AMATEUR · STREET','amateur-park':'AMATEUR · PARK','u15-street':'U15 · STREET','u15-park':'U15 · PARK','u13-street':'U13 · STREET','u13-park':'U13 · PARK'};
Object.entries(MTX_RAW).forEach(([k,v])=>{
  const toRows=a=>a.map(r=>({name:r.name,info:r.info||'',score:fmtNum(r.score),bt:fmtNum(r.bt)}));
  if(Array.isArray(v)) EVENTS.mtx.cats.push({label:MTX_LABEL[k],rows:toRows(v)});
  else{
    if(v.amateur) EVENTS.mtx.cats.push({label:MTX_LABEL[k],rows:toRows(v.amateur)});
    if(v.femme) EVENTS.mtx.cats.push({label:'FEMME · PARK',rows:toRows(v.femme)});
  }
});
const VL={u13:'U13',u15:'U15',amateur:'AMATEUR',pro:'PRO'};
Object.entries(VIDY_RAW).forEach(([k,v])=>{
  ['park','street','femme'].forEach(d=>{
    if(!v[d]) return;
    const label=d==='femme'?'FEMME · PARK':VL[k]+' · '+d.toUpperCase();
    EVENTS.vidy.cats.push({label,rows:v[d].map(r=>({name:r.n,info:r.m||'',score:r.s,bt:r.bt}))});
  });
});

/* ===== Général : meilleur score des 2 manches ===== */
const keyName=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/\s+/).filter(Boolean).sort().join(' ');
const toNum=v=>v==null?null:parseFloat(String(v).replace(',','.'));
EVENTS.best={title:'GÉNÉRAL',date:'Meilleur score · Montreux + Vidy',cats:[]};
(function(){
  const labels=[...new Set([...EVENTS.mtx.cats,...EVENTS.vidy.cats].map(c=>c.label))];
  const order=['U13 · PARK','U13 · STREET','U15 · PARK','U15 · STREET','AMATEUR · PARK','AMATEUR · STREET','FEMME · PARK','PRO · PARK','PRO · STREET'];
  labels.sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
  labels.forEach(label=>{
    const map={};
    [['mtx','MONTREUX'],['vidy','VIDY']].forEach(([ev,tag])=>{
      const c=EVENTS[ev].cats.find(x=>x.label===label); if(!c) return;
      c.rows.forEach(r=>{
        const sc=toNum(r.score); if(sc==null||isNaN(sc)) return;
        const k=keyName(r.name);
        if(!map[k]||sc>map[k].n) map[k]={name:r.name,info:r.info,score:fmtNum(sc),n:sc,bt:null,tag:'MEILLEUR : '+tag};
      });
    });
    const rows=Object.values(map).sort((a,b)=>b.n-a.n);
    if(rows.length) EVENTS.best.cats.push({label,rows});
  });
})();

  $('manualBox').style.display=man?'block':'none';
  $('autoBox').style.display=man?'none':'block';
  if(!man) fillCats();
  draw();
});
['cat','top','mTitle','mDate','mCat','mList'].forEach(id=>$(id).addEventListener('input',draw));
$('fmt').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  format=b.dataset.f;
  [...$('fmt').children].forEach(x=>x.classList.toggle('on',x===b));
  draw();
});

function current(){
  if($('event').value==='manual'){
    const rows=$('mList').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split(';').map(s=>s.trim());
      return {name:p[0]||'',score:p[1]||null,info:p[2]||'',bt:null};
    });
    return {title:$('mTitle').value.toUpperCase(),date:$('mDate').value,cat:$('mCat').value.toUpperCase(),rows};
  }
  const ev=EVENTS[$('event').value]; const c=ev.cats[+$('cat').value]||ev.cats[0];
  return {title:ev.title,date:ev.date,cat:c.label,rows:c.rows.filter(r=>r.score!=null)};
}

/* ===== Dessin ===== */
function fit(ctx,text,max,size,font){
  let s=size; ctx.font=`${s}px ${font}`;
  while(ctx.measureText(text).width>max && s>18){ s-=2; ctx.font=`${s}px ${font}`; }
  return s;
}
function draw(){
  const cv=$('cv'), W=1080, H=format==='story'?1920:1350;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const d=current(); const top=+$('top').value; const rows=d.rows.slice(0,top);
  const B="'Bebas Neue', Impact, sans-serif", C="'Barlow Condensed', Arial, sans-serif";

  // fond
  ctx.fillStyle='#080808'; ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W*.5,H*.22,0,W*.5,H*.22,W*.75);
  g.addColorStop(0,'rgba(204,0,0,.42)'); g.addColorStop(.5,'rgba(204,0,0,.08)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.025)'; ctx.font=`520px ${B}`; ctx.textAlign='center';
  ctx.fillText('RSL',W/2,H*.62);

  // bande haut
  const off=format==='story'?150:0;
  ctx.fillStyle='#000'; ctx.fillRect(0,off,W,110);
  ctx.fillStyle='#cc0000'; ctx.fillRect(0,off+110,W,6); ctx.fillRect(0,off,120,110);
  if(logo.complete && logo.naturalWidth){ const h=78,w=h*logo.naturalWidth/logo.naturalHeight; ctx.drawImage(logo,60-w/2,off+16,w,h); }
  ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font=`44px ${B}`; ctx.fillText('ROMANDIE SCOOTER LEAGUE',150,off+56);
  ctx.fillStyle='#cc0000'; ctx.font=`700 22px ${C}`; ctx.fillText('CHAMPIONNAT ROMAND DE TROTTINETTE FREESTYLE 2026',150,off+88);

  // titre
  let y=off+230;
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font=`700 28px ${C}`;
  ctx.fillText('RÉSULTATS OFFICIELS',W/2,y);
  y+=122;
  ctx.fillStyle='#fff'; const ts=fit(ctx,d.title,W-120,128,B); ctx.font=`${ts}px ${B}`;
  ctx.shadowColor='rgba(204,0,0,.6)'; ctx.shadowBlur=30; ctx.fillText(d.title,W/2,y); ctx.shadowBlur=0;
  y+=24; ctx.fillStyle='#cc0000'; ctx.fillRect(W/2-30,y,60,5);
  y+=58; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font=`600 30px ${C}`; ctx.fillText(d.date,W/2,y);
  // pastille catégorie
  y+=38; ctx.font=`44px ${B}`; const cw=ctx.measureText(d.cat).width+70;
  ctx.fillStyle='#cc0000'; ctx.fillRect(W/2-cw/2,y,cw,66);
  ctx.fillStyle='#fff'; ctx.fillText(d.cat,W/2,y+50);
  y+=110;

  // lignes
  const footer=format==='story'?260:110;
  const avail=H-y-footer;
  const rh=Math.min(format==='story'?120:104,Math.floor(avail/Math.max(rows.length,1)));
  const medal=['#f5c518','#c9c9c9','#cd7f32'];
  rows.forEach((r,i)=>{
    const x=70, w=W-140, h=rh-12, yy=y+i*rh;
    ctx.fillStyle=i<3?'rgba(255,255,255,.07)':'rgba(255,255,255,.035)';
    ctx.fillRect(x,yy,w,h);
    ctx.fillStyle=i<3?medal[i]:'#cc0000'; ctx.fillRect(x,yy,h,h);
    ctx.fillStyle=i<3?'#111':'#fff'; ctx.textAlign='center';
    ctx.font=`${Math.round(h*.62)}px ${B}`; ctx.fillText(String(i+1),x+h/2,yy+h*.72);
    ctx.textAlign='left';
    const hasInfo=!!r.info && h>70;
    ctx.fillStyle='#fff';
    const ns=fit(ctx,r.name.toUpperCase(),w-h-260,Math.round(h*(hasInfo?.46:.56)),B);
    ctx.font=`${ns}px ${B}`;
    ctx.fillText(r.name.toUpperCase(),x+h+26,yy+(hasInfo?h*.52:h*.66));
    if(hasInfo){ ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font=`600 ${Math.round(h*.24)}px ${C}`;
      let info=r.info; while(ctx.measureText(info).width>w-h-280 && info.length>3) info=info.slice(0,-2);
      if(info!==r.info) info=info.trim()+'…';
      ctx.fillText(info,x+h+26,yy+h*.84); }
    ctx.textAlign='right';
    ctx.fillStyle='#fff'; ctx.font=`${Math.round(h*.58)}px ${B}`;
    ctx.fillText(r.score??'NC',x+w-24,yy+((btOk(r.bt)||r.tag)?h*.56:h*.68));
    if(r.tag){ ctx.fillStyle='#ff6b6b'; ctx.font=`700 ${Math.round(h*.2)}px ${C}`; ctx.fillText(r.tag,x+w-24,yy+h*.86); }
    if(btOk(r.bt)){ ctx.fillStyle='#ff6b6b'; ctx.font=`700 ${Math.round(h*.2)}px ${C}`; ctx.fillText('BEST TRICK '+r.bt,x+w-24,yy+h*.86); }
  });
  if(!rows.length){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font=`600 34px ${C}`; ctx.fillText('Aucun résultat',W/2,y+80); }

  // pied
  const fy=H-(format==='story'?190:60);
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font=`700 26px ${C}`;
  ctx.fillText('RSL-SWISS.CH  ·  @RSL.SWISS',W/2,fy);
  ctx.fillStyle='#cc0000'; ctx.fillRect(0,H-10,W,10);
}

$('dl').addEventListener('click',()=>{
  draw();
  const d=current();
  const name=('rsl-'+d.title+'-'+d.cat+'-'+format).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
  const a=document.createElement('a'); a.download=name+'.png'; a.href=$('cv').toDataURL('image/png'); a.click();
});

fillCats();
Promise.all([document.fonts.load("40px 'Bebas Neue'"),document.fonts.load("700 20px 'Barlow Condensed'")]).finally(draw);
draw();
</script>
</body>
</html>
