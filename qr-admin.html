<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="manifest" href="/rsl-qr.webmanifest">
<meta name="theme-color" content="#cc0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSL Scan">
<link rel="apple-touch-icon" href="/images/app/rsl-qr-180.png">
<link rel="icon" type="image/png" href="/images/app/rsl-qr-192.png">

<title>QR cours — Admin RSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#cc0000;--bg:#080808;--fg:#f0f0f0;--muted:#8a8a8a;--card:#111;--line:rgba(255,255,255,.08);--ok:#25d366}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Barlow Condensed',system-ui,sans-serif;min-height:100vh}
header{background:#000;border-bottom:3px solid var(--red);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:.08em}
header h1 span{color:var(--red)}
header a{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:22px 14px 60px}
.box{background:var(--card);border:1px solid var(--line);padding:18px;position:relative;margin-bottom:14px}
.box:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;background:#050505;color:#fff;border:1px solid rgba(255,255,255,.15);padding:12px;font-family:inherit;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border:0;padding:12px 16px;font-family:inherit;font-weight:900;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.full{width:100%;margin-top:14px;padding:14px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#ddd}
.btn.green{background:var(--ok);color:#04210f}
.msg{margin-top:10px;font-size:15px;color:#ff6b6b;min-height:18px}
.hint{color:var(--muted);font-size:15px;line-height:1.4}
.hide{display:none!important}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{background:#050505;color:var(--muted);border:1px solid rgba(255,255,255,.15);padding:12px 6px;font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.result{text-align:center}
.card-qr{display:inline-block;background:#fff;padding:14px;margin:12px auto}
.card-qr img,.card-qr canvas{display:block}
.big{font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;letter-spacing:.04em}
.code{font-family:monospace;font-size:20px;letter-spacing:.2em;color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.item .n{font-weight:900;font-size:19px;text-transform:uppercase}
.item .m{font-size:14px;color:var(--muted)}
.item .r{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;text-align:right;white-space:nowrap}
.item.off{opacity:.45}
.item .b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.item .b button{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;background:#1b1b1b;color:#ddd;border:1px solid rgba(255,255,255,.14);cursor:pointer}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{flex:1;background:#050505;color:var(--muted);border:1px solid rgba(255,255,255,.15);padding:11px;font-family:inherit;font-weight:900;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tabs button.on{background:#fff;color:#000}


.install{display:none;margin-bottom:14px;background:#111;border:1px solid rgba(204,0,0,.45);padding:14px;font-size:16px;line-height:1.4}
.install b{color:#fff}
.install .btn{margin-top:10px}
@media all and (display-mode: standalone){.install{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>QR <span>COURS</span></h1>
  <a href="/scan">Scanner →</a>
</header>
<div class="wrap">
  <div class="install" id="install">
    📲 <b>Installe l'app sur ton téléphone</b><br>
    <span id="instIos">Sur iPhone : touche <b>Partager</b> ⬆️ puis <b>« Sur l'écran d'accueil »</b>.</span>
    <span id="instAnd" style="display:none">Clique sur le bouton pour l'ajouter à ton écran d'accueil.</span>
    <div><button class="btn" id="instBtn" style="display:none">Installer RSL Scan</button> <button class="btn ghost" id="instClose">Plus tard</button></div>
  </div>
  <div class="box" id="login">
    <label for="code">Code admin</label>
    <input type="password" id="code" autocomplete="current-password">
    <button class="btn full" id="go">Entrer</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hide">
    <div class="tabs"><button class="on" data-t="new">Nouveau QR</button><button data-t="list">Liste</button><button data-t="mem">Membres</button></div>

    <div id="tabNew">
      <div class="box">
        <label>Prénom (et nom)</label>
        <input id="prenom" placeholder="ex. Nilo S.">
        <label>Type</label>
        <div class="seg" id="type">
          <button data-v="cours" class="on">1 cours</button>
          <button data-v="pack">15 cours</button>
          <button data-v="annuel">Gratuit année</button>
        </div>
        <div id="packBox" class="hide">
          <label>Nombre de cours</label>
          <input id="total" type="number" min="1" value="15">
        </div>
        <div id="annuelBox" class="hide">
          <label>Valable jusqu'au</label>
          <input id="until" type="date">
        </div>
        <label>Note (facultatif)</label>
        <input id="note" placeholder="ex. payé TWINT 20.09">
        <button class="btn full" id="create">Créer le QR code</button>
        <div class="msg" id="createMsg"></div>
      </div>

      <div class="box result hide" id="result">
        <div class="big" id="rName"></div>
        <div class="hint" id="rType"></div>
        <div class="card-qr" id="rQr"></div>
        <div class="code" id="rCode"></div>
        <div class="actions">
          <a class="btn green" id="rWa" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
          <button class="btn ghost" id="rDl">Télécharger l'image</button>
          <button class="btn ghost" id="rCopy">Copier le lien</button>
        </div>
      </div>
    </div>

    <div id="tabMem" class="hide">
      <button class="btn full" id="mNewBtn" style="margin:0 0 12px">+ Nouvelle carte membre</button>

      <div class="box hide" id="mForm">
        <div class="big" id="mFormTitle" style="font-size:28px">Nouvelle carte</div>
        <label>Nom et prénom</label><input id="mName">
        <label>Date de naissance</label><input id="mBirth" placeholder="jj.mm.aaaa">
        <label>Formule</label>
        <select id="mTier">
          <option value="starter">Starter — 50 CHF/an</option>
          <option value="rider">Rider — 80 CHF/an</option>
          <option value="support">Soutien — 149 CHF/an</option>
          <option value="progression">Progression — 15 cours inclus</option>
          <option value="premium">Premium — cours gratuits</option>
        </select>
        <label>Statut affiché (facultatif)</label><input id="mRole" placeholder="ex. Coach, JF Team, Président">
        <label>Valable jusqu'au</label><input id="mValid" value="31.12.2027">
        <label>Photo</label>
        <div style="display:flex;gap:10px;align-items:center">
          <img id="mPhotoPrev" alt="" style="width:64px;height:76px;object-fit:cover;background:#222;border:1px solid rgba(255,255,255,.15)">
          <input type="file" id="mPhoto" accept="image/*" style="font-size:14px">
        </div>
        <label>Avantages (1 par ligne)</label>
        <textarea id="mBenef" rows="6" style="width:100%;background:#050505;color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px;font-family:inherit;font-size:16px"></textarea>
        <label style="display:flex;gap:8px;align-items:center;margin-top:12px;letter-spacing:.1em"><input type="checkbox" id="mActive" checked style="width:auto"> Carte active</label>
        <button class="btn full" id="mSave">Enregistrer la carte</button>
        <button class="btn ghost full" id="mCancel" style="margin-top:6px">Annuler</button>
        <div class="msg" id="mMsg"></div>
      </div>

      <div class="box">
        <input id="searchM" placeholder="Rechercher un membre">
        <div class="list" id="listM" style="margin-top:8px"></div>
      </div>
    </div>

    <div id="tabList" class="hide">
      <div class="box">
        <input id="search" placeholder="Rechercher un prénom ou un code">
        <div class="list" id="list" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SB='https://jynxifufaauoxwzjapzq.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5bnhpZnVmYWF1b3h3emphcHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzODI2NzcsImV4cCI6MjA3Njk1ODY3N30.vFPGhGakPIM3Xg5rn8_BrAXl6oJMJOssO780C9nXmr4';
async function rpc(fn,body){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text(); let d=null; try{d=JSON.parse(t)}catch(_){}
  if(!r.ok) throw new Error((d&&d.message)||'Erreur réseau, réessaie');
  return d;
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-CH',{day:'numeric',month:'long',year:'numeric'}):'';
const TYPE={cours:'1 cours',pack:'Pack cours',annuel:'Gratuit à l’année'};
const BILLET='https://rsl-swiss.ch/billet?c=';

let admin='', type='cours', last=null, all=[];

function billetUrl(c){ return (last&&last._carte&&last.code===c)?'https://rsl-swiss.ch/carte?c='+encodeURIComponent(c):BILLET+encodeURIComponent(c); }
const TIER={starter:'Starter',rider:'Rider',support:'Soutien',progression:'Progression',premium:'Premium'};
function describe(t){
  if(t.type==='membre') return 'Carte membre '+(TIER[(t.tier||'').toLowerCase()]||t.tier||'')+(t.valid_until?' · jusqu’au '+fmtDate(t.valid_until):'');
  if(t.type==='annuel') return 'Gratuit à l’année'+(t.valid_until?' · jusqu’au '+fmtDate(t.valid_until):'');
  if(t.type==='pack') return (t.total-t.used)+' cours restants sur '+t.total;
  return t.used>=t.total?'Cours utilisé':'1 cours';
}
function waText(t){
  return `Salut ${t.prenom} ! Voici ton QR code RSL (${describe(t)}).\nMontre-le au coach en arrivant au cours :\n${billetUrl(t.code)}`;
}
function qrCanvas(text,size){
  const tmp=document.createElement('div');
  new QRCode(tmp,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
  return tmp.querySelector('canvas');
}
function makeCard(t){
  const q=qrCanvas(billetUrl(t.code),600);
  const c=document.createElement('canvas'); c.width=800; c.height=1060;
  const x=c.getContext('2d');
  x.fillStyle='#080808'; x.fillRect(0,0,800,1060);
  x.fillStyle='#cc0000'; x.fillRect(0,0,800,90); x.fillRect(0,1050,800,10);
  x.fillStyle='#fff'; x.font="44px 'Bebas Neue', Impact, sans-serif"; x.textAlign='center';
  x.fillText('RSL · ROMANDIE SCOOTER LEAGUE',400,62);
  x.fillStyle='#fff'; x.fillRect(80,130,640,640); x.drawImage(q,100,150,600,600);
  x.font="64px 'Bebas Neue', Impact, sans-serif"; x.fillText(t.prenom.toUpperCase(),400,860);
  x.fillStyle='#cc0000'; x.font="700 32px 'Barlow Condensed', Arial, sans-serif"; x.fillText(describe(t).toUpperCase(),400,910);
  x.fillStyle='#8a8a8a'; x.font="700 26px monospace"; x.fillText(t.code,400,965);
  x.font="600 22px 'Barlow Condensed', Arial, sans-serif"; x.fillText('À montrer au coach en arrivant au cours',400,1010);
  return c;
}
function showResult(t){
  last=t;
  $('rName').textContent=t.prenom; $('rType').textContent=describe(t); $('rCode').textContent=t.code;
  $('rQr').innerHTML=''; new QRCode($('rQr'),{text:billetUrl(t.code),width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  $('rWa').href='https://wa.me/?text='+encodeURIComponent(waText(t));
  $('result').classList.remove('hide'); $('result').scrollIntoView({behavior:'smooth'});
}
$('rDl').onclick=()=>{ const c=makeCard(last); const a=document.createElement('a'); a.download='qr-rsl-'+last.prenom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'.png'; a.href=c.toDataURL('image/png'); a.click(); };
$('rCopy').onclick=()=>{ try{navigator.clipboard.writeText(billetUrl(last.code))}catch(_){}; $('rCopy').textContent='Copié ✓'; setTimeout(()=>$('rCopy').textContent='Copier le lien',1500); };

$('type').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return; type=b.dataset.v;
  [...$('type').children].forEach(x=>x.classList.toggle('on',x===b));
  $('packBox').classList.toggle('hide',type!=='pack');
  $('annuelBox').classList.toggle('hide',type!=='annuel');
};
const d0=new Date(); d0.setFullYear(d0.getFullYear()+1); $('until').value=d0.toISOString().slice(0,10);

$('create').onclick=async()=>{
  $('createMsg').textContent='';
  const prenom=$('prenom').value.trim(); if(!prenom){ $('createMsg').textContent='Mets un prénom.'; return; }
  $('create').disabled=true;
  try{
    const t=await rpc('rsl_ticket_create',{p_admin:admin,p_prenom:prenom,p_type:type,p_total:type==='pack'?(+$('total').value||15):null,p_valid_until:type==='annuel'?$('until').value:null,p_note:$('note').value});
    $('prenom').value=''; $('note').value='';
    showResult(t);
  }catch(err){ $('createMsg').textContent=err.message; }
  $('create').disabled=false;
};

async function loadList(){ all=await rpc('rsl_ticket_list',{p_admin:admin}); renderList(); }
function renderList(){
  const q=$('search').value.trim().toLowerCase();
  const rows=all.filter(t=>!q||t.prenom.toLowerCase().includes(q)||t.code.toLowerCase().includes(q));
  $('list').innerHTML=rows.length?rows.map(t=>{
    const r=t.type==='annuel'?'∞':(t.total-t.used)+'/'+t.total;
    return `<div class="item${t.active?'':' off'}">
      <div><div class="n">${esc(t.prenom)}</div><div class="m">${esc(TYPE[t.type])} · ${t.code}${t.note?' · '+esc(t.note):''}${t.active?'':' · DÉSACTIVÉ'}</div></div>
      <div><div class="r">${r}</div><div class="b">
        <button data-a="show" data-c="${t.code}">QR</button>
        ${t.type==='pack'?`<button data-a="add" data-c="${t.code}">+ cours</button>`:''}
        <button data-a="toggle" data-c="${t.code}">${t.active?'Désactiver':'Réactiver'}</button>
      </div></div></div>`;
  }).join(''):'<p class="hint">Aucun QR code.</p>';
}
$('search').oninput=renderList;
$('list').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const t=all.find(x=>x.code===b.dataset.c); if(!t) return;
  try{
    if(b.dataset.a==='show'){ switchTab('new'); showResult(t); return; }
    if(b.dataset.a==='add'){ const n=parseInt(prompt('Ajouter combien de cours à '+t.prenom+' ?','15'),10); if(!n) return; await rpc('rsl_ticket_update',{p_admin:admin,p_code:t.code,p_active:null,p_add:n}); }
    if(b.dataset.a==='toggle'){ if(t.active && !confirm('Désactiver le QR de '+t.prenom+' ?')) return; await rpc('rsl_ticket_update',{p_admin:admin,p_code:t.code,p_active:!t.active,p_add:0}); }
    loadList();
  }catch(err){ alert(err.message); }
};
let members=[], editCode=null, photoUrl='';
const BENEF={
  starter:['Membre officiel RSL','Cours RSL à 20 CHF au lieu de 30 CHF','–10 % sur le livret de tricks','–10 % dans les boutiques partenaires','Entrée Assir Skatepark : 8 CHF'],
  rider:['Accès prioritaire à certaines sessions & events','Cours RSL à 20 CHF au lieu de 30 CHF','–15 % sur le livret de tricks','–15 % dans les boutiques partenaires','Entrée Assir Skatepark : 8 CHF'],
  support:['Livret de tricks offert','Cours RSL à 20 CHF au lieu de 30 CHF','–15 % dans les boutiques partenaires','Entrée Assir Skatepark : 8 CHF'],
  progression:['15 cours inclus','Ensuite : cours à 20 CHF','–15 % matériel & partenaires','T-shirt RSL offert','Entrée Assir Skatepark : 8 CHF'],
  premium:['Tous les cours gratuits','–50 % sur les events','Suivi avancé','T-shirt + sweat offerts','Entrée Assir Skatepark : 8 CHF']
};
const CARTE='https://rsl-swiss.ch/carte?c=';
const carteUrl=c=>CARTE+encodeURIComponent(c);
async function loadMembers(){ members=await rpc('rsl_member_list',{p_admin:admin}); renderMembers(); }
function renderMembers(){
  const q=$('searchM').value.trim().toLowerCase();
  const rows=members.filter(m=>!q||(m.full_name||'').toLowerCase().includes(q)||(m.code||'').toLowerCase().includes(q));
  $('listM').innerHTML=rows.length?rows.map(m=>{
    const exp=m.valid_date&&new Date(m.valid_date+'T23:59:59')<new Date();
    return `<div class="item${m.active&&!exp?'':' off'}">
      <div style="display:flex;gap:10px;align-items:center">
        ${m.photo_url?`<img src="${esc(m.photo_url)}" alt="" style="width:42px;height:50px;object-fit:cover">`:''}
        <div><div class="n">${esc(m.full_name)}</div><div class="m">${esc(TIER[m.tier]||m.tier)} · ${esc(m.code)} · jusqu’au ${esc(m.valid_until||'—')}${exp?' · EXPIRÉE':''}${m.active?'':' · DÉSACTIVÉE'}</div></div>
      </div>
      <div class="b">
        <button data-a="qr" data-c="${esc(m.code)}">QR / Envoyer</button>
        <button data-a="edit" data-c="${esc(m.code)}">Modifier</button>
        <button data-a="renew" data-c="${esc(m.code)}">Renouveler 2027</button>
        <button data-a="code" data-c="${esc(m.code)}">Nouveau code</button>
      </div></div>`;
  }).join(''):'<p class="hint">Aucun membre.</p>';
}
$('searchM').oninput=renderMembers;

function openForm(m){
  editCode=m?m.code:null; photoUrl=m?(m.photo_url||''):'';
  $('mFormTitle').textContent=m?'Modifier la carte':'Nouvelle carte';
  $('mName').value=m?m.full_name:''; $('mBirth').value=m?(m.birth_date||''):'';
  $('mTier').value=m?(m.tier==='soutien'?'support':m.tier):'starter';
  $('mRole').value=m?(m.role||''):''; $('mValid').value=m?(m.valid_until||''):'31.12.2027';
  $('mBenef').value=(m&&Array.isArray(m.benefits)&&m.benefits.length?m.benefits:BENEF[$('mTier').value]).join('\n');
  $('mActive').checked=m?!!m.active:true; $('mPhoto').value=''; $('mPhotoPrev').src=photoUrl||''; $('mMsg').textContent='';
  $('mForm').classList.remove('hide'); $('mForm').scrollIntoView({behavior:'smooth'});
}
$('mNewBtn').onclick=()=>openForm(null);
$('mCancel').onclick=()=>$('mForm').classList.add('hide');
$('mTier').onchange=()=>{ if(!editCode) $('mBenef').value=BENEF[$('mTier').value].join('\n'); };

async function uploadPhoto(file){
  const img=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=r.result; }; r.readAsDataURL(file); });
  const max=700,k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  const path='cards/member-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const r=await fetch(SB+'/storage/v1/object/member-cards/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok) throw new Error('Envoi de la photo impossible');
  return SB+'/storage/v1/object/public/member-cards/'+path;
}
$('mPhoto').onchange=async()=>{
  const f=$('mPhoto').files[0]; if(!f) return;
  $('mMsg').textContent='Envoi de la photo…';
  try{ photoUrl=await uploadPhoto(f); $('mPhotoPrev').src=photoUrl; $('mMsg').textContent=''; }
  catch(err){ $('mMsg').textContent=err.message; }
};
$('mSave').onclick=async()=>{
  $('mMsg').textContent='';
  if(!$('mName').value.trim()){ $('mMsg').textContent='Mets un nom.'; return; }
  $('mSave').disabled=true;
  try{
    const m=await rpc('rsl_member_save',{p_admin:admin,p_code:editCode,p_full_name:$('mName').value,p_birth:$('mBirth').value.trim(),
      p_tier:$('mTier').value,p_role:$('mRole').value.trim(),p_valid:$('mValid').value.trim(),p_photo:photoUrl,
      p_benefits:$('mBenef').value.split('\n').map(x=>x.trim()).filter(Boolean),p_active:$('mActive').checked});
    $('mForm').classList.add('hide');
    await loadMembers();
    shareMember(m);
  }catch(err){ $('mMsg').textContent=err.message; }
  $('mSave').disabled=false;
};
function shareMember(m){
  switchTab('new');
  last={code:m.code,prenom:m.full_name,type:'membre',tier:m.tier,valid_until:m.valid_date,_carte:true};
  $('rName').textContent=m.full_name; $('rType').textContent='Carte '+(TIER[m.tier]||m.tier)+' · jusqu’au '+(m.valid_until||'—'); $('rCode').textContent=m.code;
  $('rQr').innerHTML=''; new QRCode($('rQr'),{text:carteUrl(m.code),width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  $('rWa').href='https://wa.me/?text='+encodeURIComponent(`Salut ${m.full_name} ! Voici ta carte membre RSL ${TIER[m.tier]||''} (valable jusqu’au ${m.valid_until}).\nOuvre-la et ajoute-la à ton écran d’accueil :\n${carteUrl(m.code)}\nMontre le QR au coach en arrivant au cours.`);
  $('result').classList.remove('hide'); $('result').scrollIntoView({behavior:'smooth'});
}
$('listM').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const m=members.find(x=>x.code===b.dataset.c); if(!m) return;
  try{
    if(b.dataset.a==='qr') return shareMember(m);
    if(b.dataset.a==='edit') return openForm(m);
    if(b.dataset.a==='renew'){
      if(!confirm(`Renouveler la carte de ${m.full_name} jusqu’au 31.12.2027 ?`)) return;
      await rpc('rsl_member_save',{p_admin:admin,p_code:m.code,p_full_name:m.full_name,p_birth:m.birth_date||'',p_tier:m.tier,p_role:m.role||'',p_valid:'31.12.2027',p_photo:m.photo_url||'',p_benefits:m.benefits||[],p_active:true});
    }
    if(b.dataset.a==='code'){
      if(!confirm(`Donner un nouveau code secret à ${m.full_name} ? L’ancien code ne marchera plus.`)) return;
      const n=await rpc('rsl_member_new_code',{p_admin:admin,p_code:m.code}); await loadMembers(); return shareMember(n);
    }
    loadMembers();
  }catch(err){ alert(err.message); }
};
function switchTab(n){
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===n));
  $('tabNew').classList.toggle('hide',n!=='new'); $('tabList').classList.toggle('hide',n!=='list'); $('tabMem').classList.toggle('hide',n!=='mem');
  if(n==='list') loadList().catch(err=>alert(err.message));
  if(n==='mem') loadMembers().catch(err=>alert(err.message));
}
document.querySelector('.tabs').onclick=e=>{ const b=e.target.closest('button'); if(b) switchTab(b.dataset.t); };

async function enter(){
  const c=$('code').value.trim(); $('loginMsg').textContent=''; if(!c) return;
  try{
    const role=await rpc('rsl_ticket_login',{p_code:c});
    if(role!=='admin') throw new Error('Ce code sert seulement à scanner. Il faut le code admin.');
    admin=c; try{sessionStorage.setItem('rsl-qr-admin',c)}catch(_){}
    $('login').classList.add('hide'); $('app').classList.remove('hide');
  }catch(err){ $('loginMsg').textContent=err.message; }
}
$('go').onclick=enter; $('code').onkeydown=e=>{ if(e.key==='Enter') enter(); };
try{ const c=sessionStorage.getItem('rsl-qr-admin'); if(c){ $('code').value=c; enter(); } }catch(_){}
</script>
<script>
(function(){
  const box=document.getElementById('install'); if(!box) return;
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let closed=false; try{closed=localStorage.getItem('rsl-install-closed')==='1'}catch(_){}
  if(standalone||closed) return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let deferred=null;
  if(ios){ box.style.display='block'; }
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferred=e;
    document.getElementById('instIos').style.display='none';
    document.getElementById('instAnd').style.display='inline';
    document.getElementById('instBtn').style.display='inline-flex';
    box.style.display='block';
  });
  document.getElementById('instBtn').onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; box.style.display='none'; };
  document.getElementById('instClose').onclick=()=>{ box.style.display='none'; try{localStorage.setItem('rsl-install-closed','1')}catch(_){} };
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/rsl-qr-sw.js').catch(()=>{});}</script>
</body>
